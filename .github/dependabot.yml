version: 2
updates:
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      angular-testing:
        patterns:
          - '@angular/*'
          - vitest
      frontend-tooling:
        patterns:
          - jsdom
          - prettier
    ignore:
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: nuget
    directories:
      - /src/ClashInsights.Api
      - /tests/ClashInsights.Tests
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      microsoft-ef:
        patterns:
          - 'Microsoft.AspNetCore.*'
          - 'Microsoft.EntityFrameworkCore*'
      test-tooling:
        patterns:
          - coverlet.collector
          - Microsoft.NET.Test.Sdk
          - 'xunit*'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
