services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: clashinsights
      POSTGRES_USER: clash
      POSTGRES_PASSWORD: ${CLASH_DB_PASSWORD:?Set CLASH_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - clash-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clash -d clashinsights"]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  clash-data:
